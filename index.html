<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tablet Scanner</title>
<style>
  :root { --bg:#f3f5f2; --ink:#16231c; --muted:#5c6b62; --card:#ffffff; --line:#d5dcd6;
          --tora:#1f6f4a; --shillong:#2b4f9e; --ok:#1f7a3d; --bad:#b3261e; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#121714; --ink:#e8efe9; --muted:#9db0a3; --card:#1b231e; --line:#2d3a32;
            --tora:#3fae7c; --shillong:#6d94e8; --ok:#5fcf86; --bad:#ff8a80; }
  }
  * { box-sizing:border-box; }
  body { margin:0; font-family: system-ui, sans-serif; background:var(--bg); color:var(--ink); padding:12px; max-width:560px; margin-inline:auto; }
  h1 { font-size:1.15rem; margin:4px 0 12px; }
  .dest { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
  .dest button { padding:12px 8px; border:2px solid var(--line); border-radius:10px; background:var(--card); color:var(--ink); font-size:1rem; text-align:left; }
  .dest button b { display:block; font-size:1.3rem; }
  .dest button span { color:var(--muted); font-size:.85rem; }
  .dest button.on[data-d="Tora"] { border-color:var(--tora); box-shadow:inset 0 0 0 1px var(--tora); }
  .dest button.on[data-d="Shillong"] { border-color:var(--shillong); box-shadow:inset 0 0 0 1px var(--shillong); }
  .cam { position:relative; margin:12px 0; border-radius:12px; overflow:hidden; background:#000; aspect-ratio:4/3; }
  video { width:100%; height:100%; object-fit:cover; }
  .line { position:absolute; left:8%; right:8%; top:50%; height:2px; background:rgba(255,60,60,.85); }
  .slots { display:grid; gap:8px; }
  .slot { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:10px 12px; }
  .slot small { color:var(--muted); display:block; }
  .slot div { font-size:1.1rem; font-variant-numeric:tabular-nums; min-height:1.4em; word-break:break-all; }
  .slot.done { border-color:var(--ok); }
  #msg { margin:12px 0; padding:10px 12px; border-radius:10px; background:var(--card); border:1px solid var(--line); min-height:44px; }
  #msg.ok { border-color:var(--ok); color:var(--ok); }
  #msg.bad { border-color:var(--bad); color:var(--bad); }
  .row { display:flex; gap:8px; }
  .row button { flex:1; padding:12px; border-radius:10px; border:1px solid var(--line); background:var(--card); color:var(--ink); font-size:1rem; }
</style>
</head>
<body>
<h1>Tablet scan</h1>

<div class="dest" id="dest">
  <button data-d="Tora"><b>Tora</b><span id="cTora">0 / 361</span></button>
  <button data-d="Shillong"><b>Shillong</b><span id="cShillong">0 / 483</span></button>
</div>

<div class="cam"><video id="v" playsinline muted></video><div class="line"></div></div>

<div class="slots">
  <div class="slot" id="sImei"><small>IMEI (15 digit)</small><div id="imei">—</div></div>
  <div class="slot" id="sSerial"><small>Serial number</small><div id="serial">—</div></div>
</div>

<div id="msg">Select Tora or Shillong, then scan the barcodes.</div>

<div class="row">
  <button id="clear">Clear</button>
  <button id="flash">Torch</button>
</div>

<script>
const API_URL = 'https://script.google.com/macros/s/AKfycbzQoJl_rpUWWLOWt4zHaAfhw0jycxhYpUysZIKeQqSwtMCWyIfmCS6d_j8aM2WPPhp1uQ/exec';
const TARGETS = { Tora: 361, Shillong: 483 };

let dest = localStorage.getItem('dest') || '';
let imei = '', serial = '', busy = false, track = null;
const $ = id => document.getElementById(id);

function setMsg(t, cls) { $('msg').textContent = t; $('msg').className = cls || ''; }
function showCounts(c) {
  if (!c) return;
  $('cTora').textContent = c.Tora + ' / ' + TARGETS.Tora;
  $('cShillong').textContent = c.Shillong + ' / ' + TARGETS.Shillong;
}
function render() {
  $('imei').textContent = imei || '—';
  $('serial').textContent = serial || '—';
  $('sImei').classList.toggle('done', !!imei);
  $('sSerial').classList.toggle('done', !!serial);
  document.querySelectorAll('#dest button').forEach(b => b.classList.toggle('on', b.dataset.d === dest));
}
function reset() { imei = ''; serial = ''; render(); }

$('dest').onclick = e => {
  const b = e.target.closest('button'); if (!b) return;
  dest = b.dataset.d; localStorage.setItem('dest', dest);
  setMsg(dest + ' selected. Start scanning.'); render();
};
$('clear').onclick = () => { reset(); setMsg('Cleared.'); };
$('flash').onclick = async () => {
  try { const on = !$('flash').dataset.on; await track.applyConstraints({ advanced: [{ torch: on }] }); $('flash').dataset.on = on ? '1' : ''; }
  catch { setMsg('Torch is not supported on this phone.', 'bad'); }
};

async function save() {
  busy = true; setMsg('Saving...');
  try {
    const r = await fetch(API_URL, { method: 'POST', body: JSON.stringify({ destination: dest, imei, serial }) });
    const j = await r.json();
    showCounts(j.counts);
    if (j.ok) { navigator.vibrate && navigator.vibrate(120); setMsg('Saved to ' + dest + ' (IMEI ' + imei + ')', 'ok'); }
    else { navigator.vibrate && navigator.vibrate([200, 100, 200]); setMsg(j.duplicate ? 'Already scanned: duplicate IMEI or serial.' : 'Could not save. Try again.', 'bad'); }
  } catch (err) { setMsg('Network error: not saved. Check your internet and scan again.', 'bad'); }
  reset();
  setTimeout(() => busy = false, 1500);
}

function handle(raw) {
  if (busy) return;
  if (!dest) { setMsg('Select Tora or Shillong first.', 'bad'); return; }
  const v = raw.trim().replace(/\s+/g, '');
  if (/^\d{15}$/.test(v)) { if (v === imei) return; imei = v; }
  else { if (v === serial) return; serial = v; }
  render();
  if (imei && serial) save();
  else setMsg(imei ? 'IMEI captured. Now scan the serial number barcode.' : 'Serial captured. Now scan the IMEI barcode.');
}

async function start() {
  if (!('BarcodeDetector' in window)) { setMsg('Barcode scanning is not supported in this browser. Use Chrome on Android.', 'bad'); return; }
  const det = new BarcodeDetector({ formats: ['code_128', 'code_39', 'code_93', 'ean_13', 'itf', 'codabar', 'qr_code', 'data_matrix'] });
  const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment', width: { ideal: 1280 } } });
  $('v').srcObject = stream; await $('v').play();
  track = stream.getVideoTracks()[0];
  setInterval(async () => {
    if (busy || $('v').readyState < 2) return;
    try { const codes = await det.detect($('v')); if (codes.length) handle(codes[0].rawValue); } catch {}
  }, 250);
}

render();
fetch(API_URL).then(r => r.json()).then(j => showCounts(j.counts)).catch(() => {});
start().catch(() => setMsg('Allow camera access, then reload the page.', 'bad'));
</script>
</body>
</html>
